[tox]
min_version = 4
envlist = test_package, checks
skipsdist = True

[testenv]
basepython = python
install_command = pip install {opts} {packages}
allowlist_externals = train

setenv =
    PYTHONPATH=.
    PYTHONHASHSEED=0

[testenv:test_package]
envdir={toxinidir}/test_package
deps =
    -r{toxinidir}/requirements/test_requirements.txt
commands=
    python regression_model/train_pipeline.py
    pytest \
    -s \
    -vv \
    {posargs:tests/}

[testenv:train]
envdir = {toxworkdir}/test_package
deps =
    {[testenv:test_package]deps}
setenv =
    {[testenv:test_package]setenv}
commands=
    python regression_model/train_pipeline.py

[testenv:checks]
envidir = {toxworkdir}/checks
deps =
    -r{toxinidir}/requirements/typing_requirements.txt
commands =
    isort regression_model test
    {posargs:mypy regression_model}

[flake8]
exclude = .git,env
max-line-length=100

